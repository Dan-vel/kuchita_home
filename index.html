<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Terminal_Access</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="terminal-header">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
            <span class="header-title">bash - root@server:~</span>
        </div>

        <!-- ETAPA 1: Login -->
        <div id="stage-1" class="stage">
            <h1 class="typing">Protocolo de Seguridad</h1>
            <p class="subtitle">Identificación requerida para acceder al sistema.</p>
            
            <form id="login-form">
                <div class="input-group">
                    <label>> USER_NAME:</label>
                    <input type="text" id="user-name" placeholder="Tu nombre o apodo" required autocomplete="off">
                </div>
                <div class="input-group">
                    <label>> PIN_ACCESO (Mi cumpleaños DD/MM):</label>
                    <input type="text" id="user-pin" placeholder="Ej: 15/08" required autocomplete="off">
                </div>
                <p id="error-msg" class="error hidden">> ERROR: Credenciales inválidas.</p>
                <button type="submit" class="btn submit-btn">INICIAR SESIÓN</button>
            </form>
        </div>

        <!-- ETAPA 2: Consola de Carga (Mensajes bonitos) -->
        <div id="stage-2" class="stage hidden">
            <div id="terminal-logs" class="logs-container"></div>
        </div>

        <!-- ETAPA 3: La Propuesta (El código que ya teníamos) -->
        <div id="stage-3" class="stage hidden">
            <h1 class="typing">Confirmación de Sistema</h1>
            <p class="subtitle">Se requiere acción manual para el despliegue final.</p>
            <h2 class="big-question">¿Quieres ser mi enamorada?</h2>
            
            <div class="buttons-container">
                <button id="btn-yes" class="btn yes">SÍ, ACEPTO</button>
                <button id="btn-no" class="btn no">NO</button>
            </div>
            <div id="success-container"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
